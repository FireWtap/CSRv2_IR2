# SciFact on the shared FP32 caches from E1 and E6b.
run_name = "scifact_pilot"
task = "SciFact"
split = "test"
dtype = "float32"
padding_side = "left"
max_seq_length = 512
prompt_mode = "both"
embedding_dim = 2560
cache_corpus_chunk_size = 50000  # MTEB 1.38.39 retrieval evaluator

encoding_batch_size = 16
encoding_warmup = 2
encoding_k = 2

ks = [2, 4, 8, 16, 64]
query_batch_size = 32
corpus_block_size = 16384
top_n = 10
search_warmup = 20
search_rounds = 100
profile_cuda = true

[dense]
model = "Qwen/Qwen3-Embedding-4B"
revision = "5cf2132abc99cad020ac570b19d031efec650f2b"
cache_run = "qwen3_4b_dense_prompt_both_fp32"

[csrv2]
model = "Y-Research-Group/CSRv2-retrieval"
revision = "af16198ddd83dec2d747756a1fb592378c15c4ac"
cache_run = "released_ckpt_fp32"
