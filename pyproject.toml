[project]
name = "csrv2-repro"
version = "0.1.0"
description = "Reproduction study of CSRv2 (ICLR 2026) on retrieval with Qwen3-Embedding-4B"
readme = "AGENTS.md"
requires-python = ">=3.11,<3.12"
# Pins mirror third_party/CSRv2/requirements.txt for every package the upstream
# text pipeline imports. Do not bump without a decision entry in ledger/decisions.md.
dependencies = [
    "torch==2.7.0",
    "transformers==4.55.0",
    "sentence-transformers==5.0.0",
    "mteb==1.38.39",
    "datasets==3.3.2",
    "huggingface-hub==0.34.4",
    "accelerate==1.9.0",
    "peft==0.15.2",
    "safetensors==0.5.3",
    "numpy==2.2.6",
    "scipy==1.16.0",
    "scikit-learn==1.7.0",
    "pandas==2.3.0",
    "tqdm==4.67.1",
    "wandb==0.21.0",
    "pytrec-eval-terrier==0.5.7",
    "timm==1.0.16",
    "torchvision==0.22.0",
]

[dependency-groups]
dev = [
    "ruff==0.12.3",
    "pytest>=8",
    "ipykernel",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csrv2_repro"]

[tool.ruff]
line-length = 100
extend-exclude = ["third_party"]
